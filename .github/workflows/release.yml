name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $TAG"

      - name: Verify version consistency
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')

          echo "Tag version:   $TAG"
          echo "package.json:  $PKG_VERSION"
          echo "tauri.conf:    $TAURI_VERSION"
          echo "Cargo.toml:    $CARGO_VERSION"

          FAIL=0
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG)"
            FAIL=1
          fi
          if [ "$TAURI_VERSION" != "$TAG" ]; then
            echo "::error::tauri.conf.json version ($TAURI_VERSION) does not match tag ($TAG)"
            FAIL=1
          fi
          if [ "$CARGO_VERSION" != "$TAG" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG)"
            FAIL=1
          fi
          exit $FAIL

  frontend-checks:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Type, lint, and runtime policy checks
        run: pnpm check && pnpm lint

      - name: Frontend test suite
        run: pnpm test:unit && pnpm test:component && pnpm test:e2e:browser

      - name: Frontend build
        run: pnpm build

  build-windows:
    needs: [validate, frontend-checks]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-tauri
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ImageMagick resources
        run: pnpm setup:imagemagick

      - name: Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Package Windows app
        run: pnpm tauri:package

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ needs.validate.outputs.version }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release:
    needs: [validate, build-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ needs.validate.outputs.version }}
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DGCoder v${{ needs.validate.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, 'alpha') || contains(needs.validate.outputs.version, 'beta') || contains(needs.validate.outputs.version, 'rc') }}
          generate_release_notes: true
          files: release-artifacts/**/*
